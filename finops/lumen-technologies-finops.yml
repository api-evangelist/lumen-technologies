specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Lumen Technologies
providerId: lumen-technologies
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Network
  - Telecom
  - Edge Cloud
description: 'FOCUS-aligned FinOps for Lumen Technologies: enterprise contract-based network services
  (fiber, IP, Internet On-Demand, edge cloud, managed security). APIs themselves are not separately
  metered — they orchestrate underlying chargeable network services.'
sources:
  - https://www.lumen.com
notes: No public pricing/billing for the API itself; meters represent the underlying network services
  the APIs provision.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Lumen Technologies, Inc.
serviceCategory: Networking
billingModel:
  pricingCategory: Enterprise Contract
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Lumen
  ServiceCategory: Networking
  ProviderName: Lumen Technologies
  PublisherName: Lumen Technologies, Inc.
  InvoiceIssuerName: Lumen Technologies, Inc.
  BillingCurrency: USD
meters:
  - name: bandwidth_mbps
    unit: Mbps
    aggregation: max
    dimensions:
      - circuit
      - location
  - name: bandwidth_volume
    unit: GB
    aggregation: sum
    dimensions:
      - circuit
  - name: on_demand_hours
    unit: instance-hour
    aggregation: sum
    dimensions:
      - service
  - name: fiber_circuits
    unit: circuit
    aggregation: max
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
principles:
  - name: Visibility
    description: Pull bandwidth and on-demand usage from the Lumen customer portal and reconcile against
      the monthly invoice.
  - name: Allocation
    description: Tag circuits and Internet On-Demand instances to internal sites/teams for chargeback.
  - name: Optimization
    description: Use Internet On-Demand to scale bandwidth to actual need rather than committing to peak;
      consolidate sites onto fewer circuits where SLAs allow.
  - name: Accountability
    description: Network owners review monthly burn vs. contract; renegotiate at renewal as site/bandwidth mix changes.
