description: Lumen Technologies sells network services (Internet On-Demand, fiber, edge cloud, security)
  through enterprise contracts. The customer-facing API portal exposes provisioning and operations APIs
  for existing customers; pricing is contract-driven, not publicly listed. Treat as enterprise-only
  until Lumen publishes a public developer plans surface.
sources:
  - https://www.lumen.com
notes: Public Lumen API developer portal returned 404 at reconciliation; APIs are scoped to existing
  enterprise customers under contract.
plans:
  - id: lumen-technologies-customer-portal
    name: Customer Portal Access
    type: enterprise
    description: API access for existing Lumen enterprise customers — provisioning, network management,
      Internet On-Demand. Tied to existing service contract.
    entries:
      - label: Existing service contract
        name: contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: tied to underlying service
        userMultiplied: false
    elements:
      - name: Internet On-Demand
      - name: Network provisioning APIs
      - name: Customer portal SSO
  - id: lumen-technologies-enterprise
    name: Enterprise (Contact Sales)
    type: enterprise
    description: Custom enterprise contract for Lumen network services. Pricing custom.
    entries:
      - label: Custom contract
        name: custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Fiber / IP transit
      - name: Edge cloud
      - name: Managed security
      - name: Dedicated account team
