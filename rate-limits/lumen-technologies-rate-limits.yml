specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Lumen Technologies
providerId: lumen-technologies
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Network
  - Telecom
description: Lumen Technologies does not publish a public per-second rate-limit table for its customer-facing
  APIs. Limits are scoped by customer contract and the underlying service (Internet On-Demand, network
  management, security). Replace with concrete numbers once Lumen publishes them.
sources:
  - https://www.lumen.com
notes: Lumen API developer portal page was 404 at reconciliation time; values reflect contract-driven scaffold.
responseCodes:
  throttled: 429
  quotaExceeded: 429
limits:
  - name: Customer API requests
    scope: customer
    metric: varies
    limit: 'see customer agreement'
  - name: Internet On-Demand provisioning calls
    scope: customer
    metric: varies
    limit: 'see service-specific docs'
policies:
  - name: Contract-scoped
    description: Steady-state and burst limits are governed by the customer service contract and the
      specific Lumen product API.
  - name: Customer-portal auth
    description: APIs require authenticated customer-portal credentials; out-of-scope endpoints return
      401/403 rather than 429.
  - name: Backoff
    description: On 429, retry with exponential backoff and respect Retry-After when present.
